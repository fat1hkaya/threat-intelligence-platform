{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div class="ph-title"><h1>Tehdit aktörleri</h1><span class="head-count" id="headCount" hidden></span><span class="page-help"><button type="button" class="btn icon ghost help-btn" aria-expanded="false" aria-controls="pageHelp" aria-label="Bu sayfa hakkında" title="Bu sayfa hakkında"><i data-lucide="circle-help"></i></button><span class="help-pop" id="pageHelp" role="note" hidden>MITRE ATT&amp;CK gruplarının profilleri, kullandıkları araçlar, teknikler ve atfedilen IOC'ler.</span></span></div>
</div>
<form class="toolbar facets" id="filters" role="search" aria-label="Aktör filtreleri">
  <div class="tb-row">
    <input type="hidden" name="view" id="view" data-facet="Görünüm" data-kind="views" data-chip="off">
    <div class="tb-search"><i data-lucide="search" aria-hidden="true"></i><label for="q" class="sr-only">Aktör ara</label><input class="input" id="q" name="q" type="search" data-label="Arama" placeholder="Ad, takma ad veya G kodu" autocomplete="off"></div>
    <div class="tb-filters">
      <input type="hidden" name="country" id="country" data-facet="Köken" data-chip="off">
      <input type="hidden" name="motivation" id="motivation" data-facet="Motivasyon" data-chip="off">
      <input type="hidden" name="sector" id="sector" data-facet="Hedef sektör" data-chip="off">
      <input type="hidden" name="linked" id="linked"><input type="hidden" name="active90" id="active90">
    </div>
    <button class="btn ghost tb-clear" type="reset" hidden>Sıfırla<i data-lucide="x"></i></button>
    <div class="tb-right"><input type="hidden" name="sort" id="sort" data-facet="Sırala" data-kind="sort" data-default="techniques" value="techniques" data-options="[[&quot;techniques&quot;, &quot;Teknik sayısı&quot;], [&quot;iocs&quot;, &quot;IOC sayısı&quot;], [&quot;malware&quot;, &quot;Araç sayısı&quot;], [&quot;campaigns&quot;, &quot;Kampanya sayısı&quot;], [&quot;name&quot;, &quot;Ad&quot;]]" data-chip="off"><span class="tb-view"></span></div>
  </div>
</form>
<div class="split no-panel" id="split">
  <section class="card flush" aria-label="Aktör listesi"><div id="tbl"></div><div class="pager" id="pager"></div></section>
  <aside class="card panel" tabindex="-1" aria-label="Aktör detayı" hidden></aside>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/entities.js?v={{ v }}"></script><script src="/static/js/actors.js?v={{ v }}"></script>{% endblock %}
