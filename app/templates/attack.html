{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div><h1>MITRE ATT&amp;CK</h1><p>Enterprise ATT&amp;CK taktikleri ve teknikleri; hangi aktör, kampanya ve zararlının hangi tekniği kullandığı.</p></div>
  <div class="seg" role="group" aria-label="Görünüm" id="view"><button type="button" data-v="list" aria-pressed="true">Teknik listesi</button><button type="button" data-v="matrix">Matris</button></div>
</div>

<section aria-label="Taktikler"><div class="tactics" id="tactics"></div></section>

<form class="card filters" id="filters" role="search" aria-label="Teknik filtreleri">
  <div class="field wide"><label for="q">Teknik</label><input class="input" id="q" name="q" type="search" placeholder="ör. T1059 veya PowerShell"></div>
  <input type="hidden" name="tactic" id="tactic">
  <div class="field"><label for="actor">Aktör</label><select class="input" id="actor" name="actor"><option value="">Tümü</option></select></div>
  <div class="field"><label for="campaign">Kampanya</label><select class="input" id="campaign" name="campaign"><option value="">Tümü</option></select></div>
  <div class="field"><label for="sort">Sırala</label><select class="input" id="sort" name="sort"><option value="actors">Aktör sayısı</option><option value="campaigns">Kampanya sayısı</option><option value="malware">Zararlı sayısı</option><option value="id">Teknik kodu</option></select></div>
  <div class="field"><span>&nbsp;</span><label class="check"><input type="checkbox" name="subtechniques" id="subtechniques" value="true">Alt teknikleri de listele</label></div>
  <div class="field" style="display:flex;flex-direction:row;gap:8px"><button class="btn primary" type="submit"><i data-lucide="search"></i>Ara</button><button class="btn" type="reset">Temizle</button></div>
</form>

<div class="split no-panel" id="split">
  <section class="card flush" aria-label="Teknikler">
    <div id="listView"><div id="tbl"></div><div class="pager" id="pager"></div></div>
    <div id="matrixView" hidden style="padding:16px">
      <p class="muted" id="matrixNote" style="font-size:12.5px;margin-bottom:10px"></p>
      <div class="matrix" id="matrix"></div>
    </div>
  </section>
  <aside class="card panel" tabindex="-1" aria-label="Teknik detayı" hidden></aside>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/entities.js?v={{ v }}"></script><script src="/static/js/attack.js?v={{ v }}"></script>{% endblock %}
